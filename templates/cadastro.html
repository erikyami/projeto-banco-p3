{% extends "base.html" %}

{% block title %}Cadastro de Participante &bull; Eventos UFMA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom text-center">
                <i class="bi bi-person-plus-fill fs-2 text-primary"></i>
                <h4 class="fw-bold text-dark mt-1 mb-0">Cadastro de Participante</h4>
                <p class="text-muted small mb-0">Crie seu perfil para se inscrever em eventos e atividades acadêmicas</p>
            </div>
            <div class="card-body p-4">
                <form action="/cadastro" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nome Completo *</label>
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Lucas Gabriel Silva" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">CPF (11 dígitos) *</label>
                            <input type="text" name="cpf" maxlength="11" pattern="\d{11}" class="form-control" placeholder="12345678901" required>
                            <div class="form-text small">Apenas números.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Telefone</label>
                            <input type="text" name="telefone" class="form-control" placeholder="(98) 98888-7777">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">E-mail Acadêmico / Pessoal *</label>
                        <input type="email" name="email" class="form-control" placeholder="lucas@discente.ufma.br" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold">Senha de Acesso *</label>
                        <input type="password" name="senha" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i> Concluir Cadastro
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <span class="small text-muted">Já tem uma conta?</span>
                    <a href="/login?perfil=PARTICIPANTE" class="small fw-bold text-primary ms-1">Fazer Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
